name: froggle_game
description: "Froggle - Jeu de Boggle multijoueur en français"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_p2p_connection: ^3.0.3
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  url_launcher: ^6.2.1
  shared_preferences: ^2.2.2
  flutter_bluetooth_serial: ^0.4.0
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.7
  get_it: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/
